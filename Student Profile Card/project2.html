<!DOCTYPE html>
<html>
<head>
    <title>Student Profile Card</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: rgb(243, 216, 216);
            text-align: center;
            margin-top: 50px;
        }

        .container{
            width: 350px;
            margin: auto;
            background: rgb(245, 186, 186);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }
         input{
            width: 90%;
            padding: 8px;
            margin: 8px;
        }

        button{
            padding: 10px 20px;
            background: black;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background: red;
        }

        .card{
            margin-top: 20px;
            border: 2px solid rgba(248, 126, 126, 0.954) ;
            padding: 15px;
            border-radius: 10px;
            display: none;
            background: #f5f5f5;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Student Profile</h2>

    <input type="text" id="name" placeholder="Enter Student Name"><br>

    <input type="text" id="roll" placeholder="Enter Roll Number"><br>

    <input type="number" id="marks" placeholder="Enter Marks (0-100)"><br>

    <button onclick="showProfile()">Display Profile</button>

    <div class="card" id="card">
        <h3>Student Profile Card</h3>

        <p><b>Name:</b> <span id="sname"></span></p>

        <p><b>Roll No:</b> <span id="sroll"></span></p>

        <p><b>Marks:</b> <span id="smarks"></span></p>

        <p><b>Grade:</b> <span id="sgrade"></span></p>
    </div>

</div>

<script>

function showProfile(){

    let name = document.getElementById("name").value;
    let roll = document.getElementById("roll").value;
    let marks = Number(document.getElementById("marks").value);
    if(name == "" || roll == "" || isNaN(marks)){
        alert("Please fill all the fields.");
        return;
    }
    if(marks < 0 || marks > 100){
        alert("Marks should be between 0 and 100.");
        return;
    }
    let grade;
    if(marks >= 90){
        grade = "A";
    }else if(marks >= 80){
        grade = "B";
    }else if(marks >= 70){
        grade = "C";
    }else if(marks >= 60){
        grade = "D";
    }else{
        grade = "F";
    }
    document.getElementById("sname").innerHTML = name;
    document.getElementById("sroll").innerHTML = roll;
    document.getElementById("smarks").innerHTML = marks;
    document.getElementById("sgrade").innerHTML = grade;

    document.getElementById("card").style.display = "block";
}

</script>

</body>
</html>
